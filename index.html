<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fintech Pulse Daily</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#0b1325; color:#e8edf7;
         font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         display:flex; justify-content:center; padding:3rem 1.25rem; }
  main { max-width:34rem; width:100%; }
  img { width:180px; border-radius:16px; display:block; margin-bottom:1.5rem; }
  h1 { font-size:1.7rem; margin:0 0 .4rem; }
  p.sub { color:#9aa6bd; margin:0 0 2rem; }
  a.feed { display:inline-block; background:#2ec9a5; color:#06231c;
           padding:.7rem 1.2rem; border-radius:999px; font-weight:600;
           text-decoration:none; margin-bottom:2.5rem; }
  .ep { border-top:1px solid #1e2a44; padding:1.1rem 0; }
  .ep h2 { font-size:1rem; margin:0 0 .3rem; }
  .ep span { color:#9aa6bd; font-size:.85rem; }
  audio { width:100%; margin-top:.7rem; }
</style>
<main>
  <img src="cover.jpg" alt="Fintech Pulse Daily">
  <h1>Fintech Pulse Daily</h1>
  <p class="sub">Payments, banking and fintech — about seven minutes,
     Sunday to Thursday, ready before the drive to work.</p>
  <a class="feed" href="feed.xml">RSS feed</a>
  <div id="episodes"></div>
</main>
<script>
fetch('feed.xml').then(r => r.text()).then(t => {
  const doc = new DOMParser().parseFromString(t, 'application/xml');
  document.getElementById('episodes').innerHTML =
    [...doc.querySelectorAll('item')].map(i => {
      const q = n => i.getElementsByTagName(n)[0]?.textContent ?? '';
      const url = i.querySelector('enclosure').getAttribute('url');
      return `<div class="ep"><h2>${q('title')}</h2>
              <span>${q('itunes:duration')}</span>
              <audio controls preload="none" src="${url}"></audio></div>`;
    }).join('');
});
</script>
