name: Backfill episode

# Produces an episode for a past date. Runs are queued behind each other and
# behind the daily run, so episode numbering and the covered-products log
# never collide.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Episode date, YYYY-MM-DD"
        required: true
      number:
        description: "Episode number, e.g. 01"
        required: true
      char_budget:
        description: "Characters of spoken script"
        required: false
        default: "6600"

permissions:
  contents: write

concurrency:
  group: daily-episode
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade anthropic
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Research and write the script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINTECH_CHAR_BUDGET: ${{ inputs.char_budget }}
          FINTECH_DATE: ${{ inputs.date }}
          FINTECH_EPISODE: ${{ inputs.number }}
        run: python3 scripts/write_episode.py

      - name: Render the audio
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 scripts/render_episode.py

      - name: Log the product and the spend
        run: python3 scripts/log_episode.py

      - name: Build the feed
        env:
          FINTECH_SOURCE: incoming
          FINTECH_ADOPT: "1"
        run: python3 scripts/build_feed.py

      - name: Keep script and paid audio even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-audio-${{ github.run_id }}
          include-hidden-files: true
          path: |
            episode.json
            .render/
            incoming/*.mp3
            episodes/*.mp3
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish
        run: |
          rm -f episode.json
          if [ -z "$(git status --porcelain)" ]; then echo "nothing produced"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Episode ${{ inputs.number }} — ${{ inputs.date }}"
          git pull --rebase origin main
          git push
