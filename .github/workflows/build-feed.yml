name: Build podcast feed

# Rebuilds the feed whenever a new episode is dropped into incoming/.
# This is the path that works while the Mac is off: whatever puts an MP3
# in incoming/ (the scheduled Claude task, or a manual upload) triggers it.

on:
  push:
    paths:
      - "incoming/**"
      - "scripts/build_feed.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Build feed from incoming episodes
        env:
          FINTECH_SOURCE: incoming
          FINTECH_ADOPT: "1"
        run: |
          mkdir -p incoming
          python3 scripts/build_feed.py

      - name: Commit updated feed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild feed from incoming episodes"
          git push
