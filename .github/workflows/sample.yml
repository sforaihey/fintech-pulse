name: Sample clip

# A short two-host clip rendered three ways, for judging voices and script
# style without paying for a whole episode.

on:
  workflow_dispatch:
    inputs:
      chars:
        description: "Characters of spoken script in the clip"
        required: false
        default: "950"

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --quiet --upgrade anthropic
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Write and render the clip
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FINTECH_SAMPLE_CHARS: ${{ inputs.chars }}
        run: python3 scripts/make_sample.py
      - name: Publish
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -m "Sample clip" && git push
