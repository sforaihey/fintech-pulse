name: Daily episode

# 07:15 Riyadh (04:15 UTC), Sunday to Thursday. The whole show is produced
# here: research and script via Claude, audio via ElevenLabs, then the feed is
# rebuilt and committed in the same run — a GITHUB_TOKEN commit does not
# trigger another workflow, so nothing may be left for a second one to do.

on:
  # GitHub runs scheduled workflows on a best-effort basis -- firings are
  # routinely late and sometimes dropped. Four attempts across the morning,
  # made safe by the "already exists" check in write_episode.py.
  schedule:
    - cron: "12 3 * * 0-4"   # 06:12 Riyadh
    - cron: "17 4 * * 0-4"   # 07:17
    - cron: "23 5 * * 0-4"   # 08:23
    - cron: "31 7 * * 0-4"   # 10:31, last resort
  workflow_dispatch:
    inputs:
      char_budget:
        description: "Character budget for this episode"
        required: false
        default: "7500"

permissions:
  contents: write

concurrency:
  group: daily-episode
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade anthropic
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Check the keys are present
        id: keys
        env:
          A: ${{ secrets.ANTHROPIC_API_KEY }}
          E: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$A" ] || [ -z "$E" ]; then
            echo "ANTHROPIC_API_KEY or ELEVENLABS_API_KEY not set —"
            echo "skipping quietly rather than failing every morning."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Research and write the script
        if: steps.keys.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINTECH_CHAR_BUDGET: ${{ inputs.char_budget || '7500' }}
        run: python3 scripts/write_episode.py

      - name: Render the audio
        if: steps.keys.outputs.ready == 'true'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 scripts/render_episode.py

      - name: Log the product and the spend
        if: steps.keys.outputs.ready == 'true'
        run: python3 scripts/log_episode.py

      - name: Build the feed
        if: steps.keys.outputs.ready == 'true'
        env:
          FINTECH_SOURCE: incoming
          FINTECH_ADOPT: "1"
        run: python3 scripts/build_feed.py

      # Keep the audio even if publishing fails: a lost push should never
      # cost a rendered episode, which is expensive to remake.
      - name: Keep a copy of the audio
        if: steps.keys.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: episode-audio
          path: |
            incoming/*.mp3
            episodes/*.mp3
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish
        if: steps.keys.outputs.ready == 'true'
        run: |
          rm -f episode.json
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing produced — not a failure on Fri/Sat"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Episode published $(date -u '+%Y-%m-%d')"
          # Another commit can land while an episode renders, so rebase and
          # retry rather than throwing the episode away.
          for attempt in 1 2 3 4 5; do
            if git push; then echo "pushed"; exit 0; fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase origin main || exit 1
            sleep $((attempt * 5))
          done
          echo "could not push after 5 attempts"
          exit 1
