name: Daily episode

# 07:15 Riyadh (04:15 UTC), Sunday to Thursday. The whole show is produced
# here: research and script via Claude, audio via ElevenLabs, then the feed is
# rebuilt and committed in the same run — a GITHUB_TOKEN commit does not
# trigger another workflow, so nothing may be left for a second one to do.

on:
  schedule:
    - cron: "15 4 * * 0-4"
  workflow_dispatch:
    inputs:
      char_budget:
        description: "Character budget for this episode"
        required: false
        default: "4300"

permissions:
  contents: write

concurrency:
  group: daily-episode
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade anthropic
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Research and write the script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINTECH_CHAR_BUDGET: ${{ inputs.char_budget || '4300' }}
        run: python3 scripts/write_episode.py

      - name: Render the audio
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 scripts/render_episode.py

      - name: Log the product and the spend
        run: python3 scripts/log_episode.py

      - name: Build the feed
        env:
          FINTECH_SOURCE: incoming
          FINTECH_ADOPT: "1"
        run: python3 scripts/build_feed.py

      - name: Publish
        run: |
          rm -f episode.json
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing produced — not a failure on Fri/Sat"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Episode published $(date -u '+%Y-%m-%d')"
          git push
